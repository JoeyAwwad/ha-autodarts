<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darts</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: #fff; font-family: "Open Sans", "Segoe UI", Roboto, system-ui, sans-serif; overflow: hidden;
    background: linear-gradient(160deg, #221d5c 0%, #2a3688 45%, #2a55a1 100%);
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
  }
  .photo {
    background: url("photo.jpg") 50% 22% / cover no-repeat;  /* optional: put a photo.jpg next to this file */
    -webkit-mask-image: linear-gradient(90deg, #000 70%, transparent);
    mask-image: linear-gradient(90deg, #000 70%, transparent);
    animation: in 1.2s ease-out both;
  }
  main { display: flex; flex-direction: column; justify-content: center; padding: 6vw; gap: 3vh; animation: in 0.9s 0.2s ease-out both; }
  h1 { margin: 0; font-size: clamp(48px, 7vw, 112px); font-weight: 800; line-height: 0.95; letter-spacing: -0.03em; }
  h1 span { display: block; color: #7fb2ff; }
  .tag { font-size: clamp(1rem, 1.6vw, 1.4rem); opacity: 0.8; margin: 0; }
  ul { list-style: none; padding: 0; margin: 2vh 0 0; display: flex; flex-direction: column; gap: 14px; }
  li { display: flex; align-items: center; gap: 14px; font-size: clamp(1rem, 1.5vw, 1.3rem); opacity: 0.6; transition: opacity 0.3s; }
  li.busy, li.done { opacity: 1; }
  li i { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.25); flex: none; }
  li.busy i { border-top-color: #fff; animation: spin 0.8s linear infinite; }
  li.done i { border-color: #22c55e; background: #22c55e; position: relative; }
  li.done i::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 800; }
  li.fail i { border-color: #fca5a5; }
  .note { min-height: 1.4em; color: #fcd34d; font-size: 1rem; margin: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } }
  @media (max-aspect-ratio: 1/1) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
    .photo { -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); mask-image: linear-gradient(180deg, #000 70%, transparent); }
    main { justify-content: flex-start; padding-top: 2vh; }
  }
</style>
</head>
<body>
  <div class="photo" aria-hidden="true"></div>
  <main>
    <h1>Game <span>on</span></h1>
    <p class="tag">Setting up the board. Grab your darts.</p>
    <ul>
      <li id="board" class="busy"><i></i>Dartboard cameras</li>
      <li id="score"><i></i>Scoreboard</li>
    </ul>
    <p class="note" id="note"></p>
  </main>
<script>
  // Shown the moment the icon is clicked; the launcher starts the board and Home
  // Assistant behind it. Moves on to the game screen once both answer.
  const HOST = new URLSearchParams(location.search).get("host") || "127.0.0.1";
  const GAME = `http://${HOST}:8123/darts-classic/game`;
  const started = Date.now();
  const $ = (id) => document.getElementById(id);
  const up = async (url, opts) => {
    try {
      await fetch(url, { cache: "no-store", ...opts });
      return true;
    } catch (err) {
      return false;
    }
  };
  let boardOk = false;

  async function tick() {
    const secs = (Date.now() - started) / 1000;
    if (!boardOk) boardOk = await up(`http://${HOST}:3180/api/ping`);
    $("board").className = boardOk ? "done" : secs > 90 ? "fail" : "busy";
    if (boardOk || secs > 90) $("score").classList.add("busy");
    // Home Assistant sends no CORS headers; an opaque answer still means it is up.
    const haOk = (boardOk || secs > 20) && (await up(`http://${HOST}:8123/manifest.json`, { mode: "no-cors" }));
    if (haOk) $("score").className = "done";
    if (!boardOk && secs > 90) $("note").textContent = "The board is not answering: check the Autodarts window.";
    if (haOk && (boardOk || secs > 90)) {
      // Keep the welcome on screen for a moment even when everything was already up.
      setTimeout(() => location.replace(GAME), Math.max(0, 2500 - (Date.now() - started)));
      return;
    }
    if (secs > 180) {
      $("note").textContent = "The scoreboard did not start. Close this window and start it again.";
      return;
    }
    setTimeout(tick, 1000);
  }
  tick();
</script>
</body>
</html>
