services:
  board-mock:
    # The Home Assistant image already provides aiohttp for the Board Manager double.
    image: ${HOME_ASSISTANT_IMAGE:-ghcr.io/home-assistant/home-assistant:2026.10.0@sha256:1b64d38f38d922bf9d59336451fd6453e1d614f934456af4ee3d2a51061be3a4}
    entrypoint: ["python3", "/e2e/board_mock.py"]
    environment:
      BOARD_MANAGER: ${BOARD_MANAGER:-1}
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./:/e2e:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3180/health')"]
      interval: 2s
      timeout: 2s
      retries: 30

  homeassistant:
    image: ${HOME_ASSISTANT_IMAGE:-ghcr.io/home-assistant/home-assistant:2026.10.0@sha256:1b64d38f38d922bf9d59336451fd6453e1d614f934456af4ee3d2a51061be3a4}
    depends_on:
      board-mock:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      BOARD_MANAGER: ${BOARD_MANAGER:-1}
    ports:
      - "127.0.0.1:${E2E_PORT:-18123}:8123"
    volumes:
      - homeassistant_config:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
      - ../../custom_components/autodarts:/config/custom_components/autodarts:ro
      # The blueprints of the repository: the scenario starts a game by voice, the
      # demo shows them on the blueprints page.
      - ../../blueprints/automation/autodarts:/config/blueprints/automation/autodarts:ro
      - ./:/e2e:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8123/api/onboarding >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 100

volumes:
  homeassistant_config:
