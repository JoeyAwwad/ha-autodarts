# Minimal, deterministic Home Assistant configuration for the Docker E2E suite.
homeassistant:
  name: Autodarts E2E
  time_zone: Europe/Berlin
  country: DE
  language: en
  unit_system: metric
  currency: EUR
  latitude: 0
  longitude: 0
  elevation: 0

api:
# The blueprint that starts a game by voice, and Assist to talk to it.
automation:
  - id: start_game_by_voice
    alias: Start a game by voice
    use_blueprint:
      path: autodarts/start_game_by_voice.yaml
      input: {}
config:
conversation:
diagnostics:
# Serves dashboards, so the bundled Autodarts card can be verified.
frontend:
# The media browser, for the highlight gallery of the integration.
media_source:
onboarding:
system_log:
websocket_api:
# Finds boards that announce themselves via mDNS, like Board Manager 2.
zeroconf:

logger:
  default: warning
  logs:
    custom_components.autodarts: debug
