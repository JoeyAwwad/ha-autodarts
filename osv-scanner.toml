# Advisories that OSV-Scanner (and the OpenSSF Scorecard) should not report.
#
# Home Assistant 2026.9 pins cryptography 48.0.1 and PyJWT 2.13.0 exactly. Only the
# test environment installs them (requirements-test.txt); the integration itself
# ships no Python dependencies and never handles tokens with PyJWT. Each reason
# starts with the pinned version, and tests/test_consistency.py fails once the test
# base moves past it, so an entry leaves with the update that fixes it.
# dependency-review.yml lists the same advisories.
#
# Home Assistant's dev branch already uses PyJWT 2.15.1 (home-assistant/core#182659).

