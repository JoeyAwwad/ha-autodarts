delete_player:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: autodarts
    name:
      required: true
      example: "Dennis"
      selector:
        text:

start_game:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: autodarts
    game:
      required: true
      example: "501"
      selector:
        select:
          translation_key: game
          options:
            - "101"
            - "301"
            - "501"
            - "701"
            - "901"
            - "1001"
            - cricket
            - cut_throat
            - tactics
            - wild_mouse
            - shanghai
            - halve_it
            - killer
            - golf
            - baseball
            - count_up
            - around_the_clock
            - doubles
            - checkout
            - bobs_27
            - checkout_121
            - catch_40
            - jdc_challenge
            - singles
    players:
      required: false
      example: '["Dennis", "Lea"]'
      selector:
        text:
          multiple: true
    legs:
      required: false
      selector:
        number:
          min: 1
          max: 11
          mode: box
    sets:
      required: false
      selector:
        number:
          min: 1
          max: 7
          mode: box
    double_out:
      required: false
      selector:
        boolean: {}
    double_in:
      required: false
      selector:
        boolean: {}
    bull_off:
      required: false
      selector:
        boolean: {}
    bull_off_distance:
      required: false
      selector:
        boolean: {}
    teams:
      required: false
      selector:
        boolean: {}
    three_in_a_bed:
      required: false
      selector:
        boolean: {}
    start_scores:
      required: false
      example: "[501, 301]"
      selector:
        text:
          type: number
          multiple: true
    holes:
      required: false
      selector:
        select:
          options:
            - "9"
            - "18"
    rounds:
      required: false
      selector:
        number:
          min: 1
          max: 20
          mode: box
    bot_level:
      required: false
      example: "60"
      selector:
        number:
          min: 0
          max: 120
          mode: box

export:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: autodarts
    format:
      required: false
      default: csv
      selector:
        select:
          translation_key: export_format
          options:
            - csv
            - json
    what:
      required: false
      default: all
      selector:
        select:
          translation_key: export_what
          options:
            - sessions
            - matches
            - profiles
            - all
    folder:
      required: false
      example: "/media/autodarts/exports"
      selector:
        text:

link_player:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: autodarts
    player:
      required: true
      example: "Dennis"
      selector:
        text:
    person:
      required: true
      example: "person.dennis"
      selector:
        entity:
          filter:
            domain: person

unlink_player:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: autodarts
    player:
      required: true
      example: "Dennis"
      selector:
        text:

start_tournament:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: autodarts
    players:
      required: false
      example: '["Dennis", "Lea", "Max", "Kim"]'
      selector:
        text:
          multiple: true
    start_scores:
      required: false
      example: "[501, 501, 301]"
      selector:
        text:
          type: number
          multiple: true
    format:
      required: false
      example: round_robin
      selector:
        select:
          translation_key: tournament_format
          options:
            - round_robin
            - knockout
    game:
      required: false
      example: "501"
      selector:
        select:
          translation_key: game
          options:
            - "101"
            - "301"
            - "501"
            - "701"
            - "901"
            - "1001"
            - cricket
            - cut_throat
            - tactics
            - wild_mouse
    legs:
      required: false
      selector:
        number:
          min: 1
          max: 11
          mode: box
    sets:
      required: false
      selector:
        number:
          min: 1
          max: 7
          mode: box
    double_out:
      required: false
      selector:
        boolean: {}
    double_in:
      required: false
      selector:
        boolean: {}
    bull_off:
      required: false
      selector:
        boolean: {}
    bull_off_distance:
      required: false
      selector:
        boolean: {}
    third_place:
      required: false
      selector:
        boolean: {}
    random_draw:
      required: false
      selector:
        boolean: {}
    seed:
      required: false
      selector:
        number:
          min: 1
          max: 999999
          mode: box
    pause:
      required: false
      selector:
        number:
          min: 0
          max: 600
          mode: box
          unit_of_measurement: s
    summary:
      required: false
      selector:
        number:
          min: 0
          max: 60
          mode: box
          unit_of_measurement: s

stop_tournament:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: autodarts

next_tournament_match:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: autodarts

correct_dart:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: autodarts
    dart:
      required: true
      example: "2"
      selector:
        number:
          min: 1
          max: 3
          mode: box
    segment:
      required: false
      example: "T20"
      selector:
        text:
    x:
      required: false
      example: "0.035"
      selector:
        number:
          min: -3
          max: 3
          step: 0.001
          mode: box
    y:
      required: false
      example: "0.608"
      selector:
        number:
          min: -3
          max: 3
          step: 0.001
          mode: box

throw_dart:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: autodarts
    segment:
      required: false
      example: "T20"
      selector:
        text:
    x:
      required: false
      example: "0.035"
      selector:
        number:
          min: -3
          max: 3
          step: 0.001
          mode: box
    y:
      required: false
      example: "0.608"
      selector:
        number:
          min: -3
          max: 3
          step: 0.001
          mode: box

next_player:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: autodarts

undo_visit:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: autodarts
