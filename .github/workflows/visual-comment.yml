name: Visual check comment

# The second half of the visual check (visual.yml). When the check of a pull request
# ends, this workflow posts or updates one comment on the pull request: the images
# that look different, with the share of their pixels that changed, and links to the
# images before and after. It may comment, so it never checks out or runs the code
# of the pull request: it reads only the reports of the check, takes nothing from
# them but image names and numbers it checks, and writes the comment itself.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] reads the reports of the check only, never the code of the pull request
    workflows: [Visual check]
    types: [completed]

permissions: {}

concurrency:
  group: visual-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  comment:
    name: comment
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to download the reports of the check's run
      pull-requests: write # to post and update the comment
    steps:
      - name: Record the network traffic of the job
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Write the comment from the reports of the check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          # The pull request whose head is the commit the check rendered; a pull request
          # from a fork is found by the commit, and one that moved on gets no comment.
          number="$(jq -r --arg sha "$HEAD_SHA" '[.[] | select(.head.sha == $sha) | .number][0] // empty' <<<"$PULL_REQUESTS")"
          if [[ -z "$number" ]]; then
            number="$(gh pr list --state open --search "$HEAD_SHA" --json number,headRefOid \
              | jq -r --arg sha "$HEAD_SHA" '[.[] | select(.headRefOid == $sha) | .number][0] // empty')"
          fi
          if [[ -z "$number" || "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" != "$HEAD_SHA" ]]; then
            echo "No open pull request has $HEAD_SHA as its head any more."
            exit 0
          fi

          folder="$RUNNER_TEMP/visual"
          mkdir -p "$folder"
          if [[ "$CONCLUSION" == success ]]; then
            gh run download "$RUN_ID" --pattern 'visual-??' --dir "$folder"
          fi
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | "\(.name) \(.id)"' > "$folder/artifacts.txt"

          python3 - "$folder" > "$folder/post" <<'PYTHON'
          import json
          import os
          import re
          import sys

          folder = sys.argv[1]
          # Only what a report of compare.py may hold; anything else is left out.
          path_pattern = re.compile(r"^(en|de)/[a-z0-9][a-z0-9-]*\.(png|webp)$")
          statuses = {"changed", "added", "removed"}
          languages = {"en": "English", "de": "German"}
          sha = os.environ["HEAD_SHA"][:7]
          run = os.environ["RUN_URL"]
          base = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GH_REPO']}/actions/runs/{os.environ['RUN_ID']}"
          links = {}
          with open(f"{folder}/artifacts.txt") as file:
              for line in file:
                  name, _, number = line.strip().partition(" ")
                  if name in (f"visual-{code}" for code in languages) and number.isdigit():
                      links[name[-2:]] = f"{base}/artifacts/{number}"

          def percent(share):
              if share >= 1:
                  return "100 %"
              return "< 0.01 %" if share < 0.0001 else f"{share * 100:.2f} %"

          lines = ["<!-- visual-check -->", "### Visual check", ""]
          if os.environ["CONCLUSION"] != "success":
              lines.append(f"The images could not be rendered for {sha}; the [run]({run}) shows why.")
              post = "always"
          else:
              rows, unchanged, read = [], 0, 0
              for code in languages:
                  try:
                      with open(f"{folder}/visual-{code}/report.json") as file:
                          report = json.load(file)
                  except (OSError, ValueError):
                      continue
                  if not isinstance(report, dict) or not isinstance(report.get("images"), list):
                      continue
                  read += 1
                  if isinstance(report.get("unchanged"), int):
                      unchanged += report["unchanged"]
                  for entry in report["images"]:
                      if not isinstance(entry, dict):
                          continue
                      path, status, share = entry.get("path"), entry.get("status"), entry.get("share")
                      if (
                          isinstance(path, str) and path_pattern.match(path)
                          and status in statuses
                          and isinstance(share, (int, float)) and 0 <= share <= 1
                      ):
                          rows.append(f"| `docs/images/{path}` | {status} | {percent(share)} |")
              if not read:
                  lines.append(f"The [run]({run}) left no report for {sha}.")
                  post = "always"
              elif not rows:
                  lines.append(f"Rendered from the demo with its frozen clock for {sha}: every image looks as committed.")
                  post = "existing"
              else:
                  lines += [
                      f"Rendered from the demo with its frozen clock for {sha}: {len(rows)} of "
                      f"{len(rows) + unchanged} images look different from the committed ones.",
                      "",
                      "| Image | Change | Pixels changed |",
                      "| --- | --- | ---: |",
                      *rows,
                      "",
                  ]
                  if links:
                      shown = " · ".join(f"[{languages[code]}]({link})" for code, link in sorted(links.items()))
                      lines.append(f"The images before and after, with every changed pixel in red: {shown}.")
                  lines.append(
                      "This check only reports. When the change is intended, the screenshot bot "
                      "updates `docs/images` after the merge."
                  )
                  post = "always"
          with open(f"{folder}/comment.md", "w") as file:
              file.write("\n".join(lines) + "\n")
          print(post)
          PYTHON

          post="$(cat "$folder/post")"
          existing="$(gh api "repos/$GH_REPO/issues/$number/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- visual-check -->"))) | .id' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$existing" -F "body=@$folder/comment.md" >/dev/null
            echo "Updated the comment on #$number."
          elif [[ "$post" == always ]]; then
            gh api --method POST "repos/$GH_REPO/issues/$number/comments" -F "body=@$folder/comment.md" >/dev/null
            echo "Commented on #$number."
          else
            echo "Every image looks as committed; #$number needs no comment."
          fi
