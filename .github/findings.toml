# Findings of code scanning that this repository accepts, each with its reason.
# The Findings workflow of the issue assistant dismisses matching alerts with this
# reason and fails while any other alert is open:
# https://github.com/Dennis-Otto/issue-assistant#findings

[[accept]]
tool = "Scorecard"
rule = "CodeReviewID"
reason = "won't fix"
comment = "One maintainer: nobody else can approve a pull request. Every change still goes through a pull request with all required checks."

[[accept]]
tool = "Scorecard"
rule = "BranchProtectionID"
reason = "won't fix"
comment = "Required approvals would block the only maintainer. main requires pull requests, all checks, linear history and no force pushes."

[[accept]]
tool = "Scorecard"
rule = "MaintainedID"
reason = "won't fix"
comment = "Scorecard counts a repository younger than 90 days as unmaintained; this one gets commits every week."

[[accept]]
tool = "CodeQL"
rule = "js/client-side-unvalidated-url-redirection"
reason = "won't fix"
comment = "The launcher's splash page opens the game screen on the host it is started for; the host parameter takes only a host name or an IP address."
path = "contrib/classic-game-screen/extras/splash.html"

[[accept]]
tool = "CodeQL"
rule = "js/client-side-request-forgery"
reason = "won't fix"
comment = "The launcher's splash page asks the board and Home Assistant on the host it is started for whether they are up; the host parameter takes only a host name or an IP address."
path = "contrib/classic-game-screen/extras/splash.html"
