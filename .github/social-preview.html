<!doctype html>
<!-- The social preview of the repository, 1280 × 640: bash scripts/social-preview.sh
     renders it into .github/social-preview.png, which goes under Settings → Social preview. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autodarts for Home Assistant</title>
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Noto Sans", "Segoe UI", Roboto, "DejaVu Sans", sans-serif;
    color: #e6edf3;
    background:
      radial-gradient(circle at 74% 52%, rgba(45, 212, 191, 0.10), transparent 46%),
      linear-gradient(135deg, #0a1220 0%, #0d1a2b 55%, #0a1624 100%);
  }
  .text { position: absolute; left: 72px; top: 92px; width: 520px; }
  .icon { width: 120px; height: 104px; display: block; }
  h1 { font-size: 64px; font-weight: 700; margin: 44px 0 0; letter-spacing: -0.5px; color: #ffffff; }
  h2 { font-size: 40px; font-weight: 700; margin: 4px 0 0; color: #4fd1c5; }
  ul { list-style: none; padding: 0; margin: 40px 0 0; }
  li { font-size: 24px; color: #c9d4df; margin: 0 0 14px; padding-left: 28px; position: relative; }
  li::before {
    content: ""; position: absolute; left: 0; top: 10px; width: 12px; height: 12px;
    border-radius: 50%; background: #4fd1c5;
  }
  .card {
    position: absolute; right: 60px; top: 168px; width: 560px; border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 80px rgba(45, 212, 191, 0.08);
  }
</style>
</head>
<body>
  <div class="text">
    <img class="icon" src="../docs/branding/icon.svg" alt="">
    <h1>Autodarts</h1>
    <h2>for Home Assistant</h2>
    <ul>
      <li>Local realtime darts, no cloud account</li>
      <li>X01, Cricket, party and training games</li>
      <li>Scoreboard, statistics and player profiles</li>
    </ul>
  </div>
  <img class="card" src="../docs/images/en/card.png" alt="">
</body>
</html>
