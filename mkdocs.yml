# The documentation website: MkDocs with the Material theme builds it from the pages
# in docs/, and the Docs workflow publishes it on GitHub Pages with every change of
# main. This file belongs to the project: the blueprint writes it once, and its
# updates leave it as it is. The settings that every website shares come from
# .github/mkdocs-blueprint.yml, which the blueprint keeps current; a setting here
# wins over the same one there. Preview the website while you write with
#   pip install --require-hashes -r .github/docs-requirements.txt && mkdocs serve
# https://squidfunk.github.io/mkdocs-material/
INHERIT: .github/mkdocs-blueprint.yml
site_name: "Autodarts"
site_description: "Autodarts for Home Assistant: local realtime board control, X01, Cricket, party and training games, tournaments and a bot, player statistics with heatmaps, seven dashboard cards and twelve blueprints, games started by voice. No cloud account needed."
site_url: https://dennis-otto.github.io/ha-autodarts/
repo_url: https://github.com/Dennis-Otto/ha-autodarts
repo_name: Dennis-Otto/ha-autodarts
copyright: "© 2026 Trkal and HACSAutodarts contributors; 2026 Dennis Otto"

# The website starts with index.md and index.de.md. README.md and README.de.md are
# the overviews of the folder on GitHub, and docs/de/ only keeps the old addresses
# of the German pages that released versions link to.
exclude_docs: |
  /README.md
  /README.de.md
  /de/

plugins:
  search:
    lang: [en, de]
  # English and German. The German pages sit next to the English ones, named like
  # them with .de, such as games.de.md next to games.md, and make the German website
  # in de/, with German menus, search and dates, and a switch between the languages
  # in the header that keeps the page. A page without German version is shown in
  # English there. https://ultrabug.github.io/mkdocs-static-i18n/
  i18n:
    enabled: true
    languages:
      - locale: en
        name: English
        default: true
        build: true
      - locale: de
        name: Deutsch
        build: true
        site_description: "Autodarts für Home Assistant: lokale Echtzeit-Steuerung des Boards, X01, Cricket, Party- und Trainingsspiele, Turniere und ein Bot, Spielerstatistik mit Trefferbildern, sieben Dashboard-Karten und zwölf Blueprints, Spiele per Sprache starten. Kein Cloud-Konto nötig."
        nav_translations:
          Home: Start
          Get started: Erste Schritte
          Guides: Anleitungen
          Reference: Referenz
          Project: Projekt
          Changelog: Änderungen
          Decisions: Entscheidungen

# Links in the HTML of a page, links to the start pages of GitHub and links to the
# other language lead to the pages of the website, as the links of the Markdown do.
hooks:
  - scripts/mkdocs_hooks.py
  # The hooks of the blueprint, such as the sitemap of every language.
  - .github/mkdocs_blueprint.py

# The menu, a tab in the header for each section. The German website has the same
# one, with the German pages and the titles of nav_translations above.
nav:
  - Home: index.md
  - Get started:
      - getting-started.md
      - installation.md
  - Guides:
      - games.md
      - scoreboard.md
      - statistics.md
      - automations.md
      - online-matches.md
  - Reference:
      - cards.md
      - entities.md
      - how-it-works.md
      - troubleshooting.md
      - security.md
      - glossary.md
  - Project:
      - Changelog: https://github.com/Dennis-Otto/ha-autodarts/blob/main/CHANGELOG.md
      - roadmap.md
      - development.md
      - releases.md
      - creator-kit.md
      - Decisions: decisions/README.md
