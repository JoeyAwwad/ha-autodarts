# The license of every file, in the machine-readable form of REUSE
# (https://reuse.software); the Lint workflow checks it.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Trkal and HACSAutodarts contributors", "2026 Dennis Otto", "Contributors to Autodarts"]
SPDX-License-Identifier = "MIT"

# The brand artwork of Autodarts identifies the supported product. It belongs to its
# owner and is not covered by the MIT license; see the README and
# docs/branding/README.md.
[[annotations]]
path = ["custom_components/autodarts/brand/**", "docs/branding/*.svg"]
precedence = "override"
SPDX-FileCopyrightText = "Autodarts"
SPDX-License-Identifier = "LicenseRef-Autodarts-Brand"
